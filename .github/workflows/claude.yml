name: Claude Code

# @claude 멘션이 PR/이슈/코멘트에 오면 Claude가 자동으로 응답하고 코드 작업
# 사전 준비:
#   1) Anthropic의 Claude Code GitHub App을 조직에 설치
#   2) Repo Secrets에 ANTHROPIC_API_KEY 등록

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # 레포의 CLAUDE.md를 자동으로 읽어 모든 컨벤션을 그대로 따름

          # 트래커 MCP 없음. Linear 는 은퇴(SCR-1090)했고, 후속인 plane-ops 는
          # CI 에서 돌 수 없다 — 해시 검증된 scraps-plane-ops 체크아웃과 Infisical
          # 세션, PowerShell 7 이 전제이며 그중 어느 것도 러너에 없다.
          # 항목 조작이 필요하면 사람이 로컬 세션에서 한다.

          allowed_tools: |
            Bash(git:*)
            Bash(gh pr:*)
            Bash(gh issue:*)
            Bash(pnpm:*)
            Bash(npx:*)
            Bash(make:*)
            mcp__linear__*
